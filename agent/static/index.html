<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecAgent — 网络安全智能体</title>
<style>
/* ====== Reset & Base ====== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#080c12; --bg1:#0d1219; --bg2:#131820; --bg3:#1a2029;
  --fg0:#e2e8f0; --fg1:#b0b8c4; --fg2:#6b7280;
  --cyan:#39c5cf; --green:#7bed9f; --amber:#f0c040; --magenta:#c678dd;
  --red:#e06c75; --blue:#61afef; --orange:#d19a66;
  --intent-1:#e06c75; --intent-2:#d19a66; --intent-3:#61afef;
  --intent-4:#e5c07b; --intent-5:#c678dd; --intent-6:#7bed9f;
  --radius:8px; --radius-lg:14px; --font:"Inter",-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Fira Code",monospace;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font); background:var(--bg0); color:var(--fg0);
  display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
}
/* background texture */
body::before{
  content:""; position:fixed; inset:0; opacity:.03;
  background-image:radial-gradient(circle at 25% 25%,#39c5cf 1px,transparent 1px),
    radial-gradient(circle at 75% 75%,#7bed9f 1px,transparent 1px);
  background-size:50px 50px; pointer-events:none; z-index:0;
}

/* ====== Header ====== */
.header{
  position:relative; z-index:1; display:flex; align-items:center;
  justify-content:space-between; padding:10px 20px;
  background:var(--bg1); border-bottom:1px solid var(--bg3);
  backdrop-filter:blur(12px);
}
.header-left{display:flex;align-items:center;gap:12px}
.logo{
  font-family:var(--mono); font-size:18px; font-weight:700;
  color:var(--cyan); letter-spacing:-.5px;
}
.logo span{color:var(--green)}
.status-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-right{display:flex;align-items:center;gap:18px}
.stat-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.stat-item .val{color:var(--fg0);font-family:var(--mono);font-weight:600}
.stat-item .icon{font-size:14px}

/* ====== Main Layout ====== */
.main{
  position:relative;z-index:1; flex:1; display:flex; overflow:hidden;
}
.chat-container{
  flex:1; display:flex; flex-direction:column; max-width:860px;
  margin:0 auto; width:100%; padding:0 16px;
}

/* ====== Chat Messages ====== */
.messages{
  flex:1; overflow-y:auto; padding:20px 0;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}

/* Welcome */
.welcome{
  text-align:center; padding:60px 20px 30px;
}
.welcome-icon{
  font-size:48px; margin-bottom:16px; filter:grayscale(.3);
}
.welcome h1{font-size:22px;font-weight:700;margin-bottom:8px}
.welcome h1 .cyan{color:var(--cyan)}
.welcome p{color:var(--fg2);font-size:14px;max-width:400px;margin:0 auto 24px;line-height:1.6}
.quick-prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick-prompt{
  padding:8px 16px; border-radius:20px; font-size:13px; cursor:pointer;
  background:var(--bg2); border:1px solid var(--bg3); color:var(--fg1);
  transition:all .2s;
}
.quick-prompt:hover{background:var(--bg3);border-color:var(--cyan);color:var(--cyan)}

/* Message bubbles */
.msg-row{display:flex;gap:10px;margin-bottom:24px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;
}
.msg-row.user .msg-avatar{background:var(--blue);color:#fff}
.msg-row.agent .msg-avatar{background:var(--bg3);color:var(--cyan)}
.msg-body{flex:1;min-width:0}
.msg-role{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.msg-row.user .msg-role{color:var(--blue)}
.msg-row.agent .msg-role{color:var(--cyan)}
.msg-content{
  font-size:14px;line-height:1.65;color:var(--fg0);
}
.msg-content p{margin-bottom:10px}
.msg-content p:last-child{margin-bottom:0}
.msg-content code{
  font-family:var(--mono);font-size:12.5px;background:var(--bg2);
  padding:2px 6px;border-radius:4px;color:var(--amber);
}
.msg-content pre{
  font-family:var(--mono);font-size:12.5px;background:var(--bg1);
  border:1px solid var(--bg3);border-radius:var(--radius);
  padding:12px 16px;overflow-x:auto;margin:10px 0;color:var(--fg1);
  line-height:1.5;white-space:pre-wrap;
}
.msg-content strong{color:var(--amber);font-weight:600}

/* Intent tags */
.intent-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.intent-tag{
  font-size:11px;padding:3px 10px;border-radius:12px;
  font-weight:600;letter-spacing:.3px;
  background:var(--bg1);border:1px solid var(--bg3);
}
.intent-tag.i1{border-color:var(--intent-1);color:var(--intent-1)}
.intent-tag.i2{border-color:var(--intent-2);color:var(--intent-2)}
.intent-tag.i3{border-color:var(--intent-3);color:var(--intent-3)}
.intent-tag.i4{border-color:var(--intent-4);color:var(--intent-4)}
.intent-tag.i5{border-color:var(--intent-5);color:var(--intent-5)}
.intent-tag.i6{border-color:var(--intent-6);color:var(--intent-6)}

/* Meta info */
.meta-row{
  display:flex;flex-wrap:wrap;gap:16px;margin-bottom:10px;
  font-size:11px;color:var(--fg2);
}
.meta-row span{display:flex;align-items:center;gap:4px}

/* Tool calls */
.tool-calls-panel{margin-top:8px}
.tool-calls-toggle{
  font-size:12px;color:var(--fg2);cursor:pointer;display:flex;
  align-items:center;gap:6px;padding:6px 0;user-select:none;
}
.tool-calls-toggle:hover{color:var(--cyan)}
.tool-calls-toggle .arrow{transition:transform .2s;font-size:10px}
.tool-calls-toggle.open .arrow{transform:rotate(90deg)}
.tool-calls-body{display:none;margin-top:4px}
.tool-calls-body.open{display:block}
.tool-call-item{
  background:var(--bg1);border:1px solid var(--bg3);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:6px;font-size:12px;
}
.tool-call-item .tc-header{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.tool-call-item .tc-name{
  font-family:var(--mono);font-weight:600;color:var(--cyan);font-size:12px;
}
.tool-call-item .tc-args{
  font-family:var(--mono);color:var(--fg2);font-size:11px;
  background:var(--bg2);padding:2px 6px;border-radius:3px;
}
.tool-call-item .tc-result{
  color:var(--fg1);font-size:11px;line-height:1.5;
  opacity:.85;max-height:80px;overflow-y:auto;
}

/* Feedback */
.feedback-row{
  display:flex;align-items:center;gap:8px;margin-top:10px;
  padding-top:8px;border-top:1px solid var(--bg3);
}
.feedback-btn{
  display:flex;align-items:center;gap:5px;padding:6px 14px;
  border-radius:var(--radius);border:1px solid var(--bg3);
  background:var(--bg2);color:var(--fg2);cursor:pointer;
  font-size:12px;transition:all .2s;
}
.feedback-btn:hover{background:var(--bg3);color:var(--fg0)}
.feedback-btn.active-good{background:#1a3a2a;border-color:var(--green);color:var(--green)}
.feedback-btn.active-bad{background:#3a1a1a;border-color:var(--red);color:var(--red)}
.feedback-done{font-size:11px;color:var(--fg2);display:flex;align-items:center;gap:4px}

/* Loading */
.thinking{
  display:flex;align-items:center;gap:10px;padding:16px 0;
  color:var(--fg2);font-size:13px;
}
.thinking-dots{display:flex;gap:4px}
.thinking-dots span{
  width:5px;height:5px;border-radius:50%;background:var(--cyan);
  animation:bounce 1.4s infinite both;
}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}

/* Error */
.error-msg{
  background:#2a1518;border:1px solid var(--red);border-radius:var(--radius);
  padding:12px 16px;font-size:13px;color:var(--red);
}

/* ====== Input ====== */
.input-area{
  position:relative;z-index:1;padding:10px 0 16px;
}
.input-wrap{
  display:flex;gap:10px;align-items:flex-end;
  background:var(--bg1);border:1px solid var(--bg3);border-radius:var(--radius-lg);
  padding:8px 8px 8px 16px;transition:border-color .2s;
}
.input-wrap:focus-within{border-color:var(--cyan)}
.input-wrap textarea{
  flex:1;background:transparent;border:none;outline:none;color:var(--fg0);
  font-family:var(--font);font-size:14px;resize:none;min-height:24px;
  max-height:120px;line-height:1.5;padding:4px 0;
}
.input-wrap textarea::placeholder{color:var(--fg2)}
.send-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:var(--cyan);color:var(--bg0);cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.send-btn:hover{background:var(--green);transform:scale(1.05)}
.send-btn:disabled{background:var(--bg3);color:var(--fg2);cursor:not-allowed;transform:none}
.send-btn:disabled:hover{background:var(--bg3);transform:none}
.tip{text-align:center;font-size:10px;color:var(--fg2);margin-top:6px}

/* ====== Responsive ====== */
@media(max-width:600px){
  .header{padding:8px 12px}
  .stat-item{font-size:10px}
  .chat-container{padding:0 10px}
  .welcome{padding:30px 10px 20px}
  .welcome h1{font-size:18px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">Sec<span>Agent</span></div>
    <div class="status-dot" id="statusDot"></div>
  </div>
  <div class="header-right">
    <div class="stat-item"><span class="icon">&#9881;</span>Skills <span class="val" id="statSkills">—</span></div>
    <div class="stat-item"><span class="icon">&#9776;</span>记忆 <span class="val" id="statMemory">—</span></div>
  </div>
</header>

<div class="main">
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">&#128737;</div>
        <h1>网络<span class="cyan">安全</span>智能体</h1>
        <p>结合意图识别 + 754个安全技能 + 记忆系统，智能理解并执行安全分析任务</p>
        <div class="quick-prompts">
          <button class="quick-prompt" data-text="帮我分析一下服务器有没有挖矿木马">挖矿木马分析</button>
          <button class="quick-prompt" data-text="扫描一下生产环境的漏洞并列出高危CVE">漏洞扫描</button>
          <button class="quick-prompt" data-text="查一下IP地址 45.33.32.156 的威胁情报">威胁情报查询</button>
          <button class="quick-prompt" data-text="帮我做一次等保三级合规基线检查">合规基线检查</button>
          <button class="quick-prompt" data-text="检查一下SSL证书到期情况并告警">证书到期监控</button>
          <button class="quick-prompt" data-text="紧急！服务器被入侵了帮我立即隔离">应急响应隔离</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="描述你的安全需求..."
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送 (Enter)">&#10148;</button>
      </div>
      <div class="tip">Enter 发送  ·  Shift+Enter 换行</div>
    </div>
  </div>
</div>

<script>
const SEND_BTN = document.getElementById('sendBtn');
const INPUT = document.getElementById('userInput');
const MESSAGES = document.getElementById('messages');
const WELCOME = document.getElementById('welcome');
const STAT_SKILLS = document.getElementById('statSkills');
const STAT_MEMORY = document.getElementById('statMemory');
const STATUS_DOT = document.getElementById('statusDot');

let isLoading = false;
let currentMsgEl = null;

// ====== Init ======
fetchStats();
document.querySelectorAll('.quick-prompt').forEach(btn => {
  btn.addEventListener('click', () => {
    INPUT.value = btn.dataset.text;
    sendMessage();
  });
});

// ====== API calls ======
async function fetchStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    STAT_SKILLS.textContent = d.skills_loaded || '—';
    const mem = d.memory || {};
    STAT_MEMORY.textContent = (mem.total_entries || 0) + '/' + (mem.confirmed || 0);
  } catch(e) {}
}

async function sendMessage() {
  if (isLoading) return;
  const msg = INPUT.value.trim();
  if (!msg) return;

  isLoading = true;
  SEND_BTN.disabled = true;
  INPUT.value = '';
  INPUT.style.height = 'auto';

  if (WELCOME) WELCOME.remove();

  addUserMessage(msg);
  const thinkEl = addThinking();
  scrollDown();

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg}),
    });
    const data = await r.json();

    thinkEl.remove();
    addAgentMessage(data);
    fetchStats();
  } catch(e) {
    thinkEl.remove();
    addError('无法连接到 SecAgent 服务。请确认服务已启动: python3 agent/server.py');
  }

  isLoading = false;
  SEND_BTN.disabled = false;
  INPUT.focus();
  scrollDown();
}

async function sendFeedback(msgText, fb) {
  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msgText, feedback: fb}),
    });
    fetchStats();
  } catch(e) {}
}

// ====== Render ======
function addUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="msg-avatar">&#9786;</div>
    <div class="msg-body">
      <div class="msg-role">YOU</div>
      <div class="msg-content">${escapeHtml(text)}</div>
    </div>`;
  MESSAGES.appendChild(row);
}

function addThinking() {
  const el = document.createElement('div');
  el.className = 'thinking';
  el.innerHTML = `
    <div class="thinking-dots"><span></span><span></span><span></span></div>
    SecAgent 分析中...`;
  MESSAGES.appendChild(el);
  return el;
}

function addAgentMessage(data) {
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.dataset.message = escapeHtml(data.message || '');

  let html = `<div class="msg-avatar">&#128300;</div><div class="msg-body">`;
  html += `<div class="msg-role">SecAgent</div>`;

  // Intents
  if (data.intents && data.intents.length > 0) {
    html += `<div class="intent-tags">`;
    data.intents.forEach(i => {
      const cls = 'i' + (i.main_intent_id || 0);
      html += `<span class="intent-tag ${cls}">${escapeHtml(i.main_intent_name||'')} › ${escapeHtml(i.sub_intent_name||'')}</span>`;
    });
    html += `</div>`;
  }

  // Meta
  html += `<div class="meta-row">`;
  if (data.candidate_skills && data.candidate_skills.length > 0) {
    html += `<span>&#128218; ${data.candidate_skills.map(s=>escapeHtml(s.domain||s.name)).join(', ')}</span>`;
  }
  if (data.similar_cases_count > 0) {
    html += `<span>&#128196; ${data.similar_cases_count} 个相似案例</span>`;
  }
  html += `</div>`;

  // Summary
  if (data.summary) {
    html += `<div class="msg-content">${simpleMarkdown(data.summary)}</div>`;
  } else if (data.intent_results && data.intent_results.length > 0) {
    const parts = data.intent_results.map(r => r.result).filter(Boolean);
    if (parts.length > 0) {
      html += `<div class="msg-content">${simpleMarkdown(parts.join('\n\n---\n\n'))}</div>`;
    }
  }

  // Tool calls
  const allToolCalls = [];
  if (data.intent_results) {
    data.intent_results.forEach(r => {
      if (r.tool_calls) allToolCalls.push(...r.tool_calls);
    });
  }
  if (allToolCalls.length > 0) {
    html += `<div class="tool-calls-panel">`;
    html += `<div class="tool-calls-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">`;
    html += `<span class="arrow">&#9654;</span> 工具调用记录 (${allToolCalls.length})</div>`;
    html += `<div class="tool-calls-body">`;
    allToolCalls.forEach(tc => {
      const argsStr = tc.arguments ? JSON.stringify(tc.arguments) : '';
      html += `<div class="tool-call-item">`;
      html += `<div class="tc-header"><span class="tc-name">${escapeHtml(tc.tool)}</span>`;
      if (argsStr) html += `<span class="tc-args">${escapeHtml(argsStr)}</span>`;
      html += `</div>`;
      if (tc.result_summary) html += `<div class="tc-result">${escapeHtml(tc.result_summary)}</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  }

  // Feedback
  html += `<div class="feedback-row" data-msg="${escapeHtml(data.message||'')}">`;
  html += `<button class="feedback-btn good" onclick="handleFeedback(this,'confirmed')">&#10003; 有用</button>`;
  html += `<button class="feedback-btn bad" onclick="handleFeedback(this,'rejected')">&#10007; 无用</button>`;
  html += `</div>`;

  html += `</div>`;
  row.innerHTML = html;
  MESSAGES.appendChild(row);
}

function addError(text) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = text;
  MESSAGES.appendChild(el);
}

// ====== Helpers ======
function handleFeedback(btn, fb) {
  const row = btn.closest('.feedback-row');
  const msg = row.dataset.msg || '';
  const good = row.querySelector('.good');
  const bad = row.querySelector('.bad');

  good.classList.remove('active-good');
  bad.classList.remove('active-bad');

  if (fb === 'confirmed') {
    good.classList.add('active-good');
  } else {
    bad.classList.add('active-bad');
  }

  sendFeedback(msg, fb);

  const done = document.createElement('span');
  done.className = 'feedback-done';
  done.textContent = '✓ 已记录';
  row.appendChild(done);
}

function scrollDown() {
  requestAnimationFrame(() => {
    MESSAGES.scrollTop = MESSAGES.scrollHeight;
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function simpleMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\n/g, '<br>');
  return html;
}
</script>
</body>
</html>
